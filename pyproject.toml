[project]
name = "forestsens"
version = "2.0.0"
description = "Python client for the ForestSens API (upload, batch, download)"
readme = "Readme.md"
license = { text = "MIT" }
authors = [{ name = "Johannes Rahlf", email = "johannes.rahlf@nibio.no" }]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31,<3.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/SmartForest-no/forestsens-api"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forestsens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
